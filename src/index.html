<body>

  <!-- =====================
       MAIN MENU
  ====================== -->

  <section id="start-screen" class="main-menu">

    <div class="card main-menu-card">

      <h1 class="game-title">
        ⚓ Battleship
      </h1>

      <p class="subtitle">
        Sink the enemy fleet
      </p>


      <img 
        src="./images/ship.webp"
        alt="Battleship ship"
        class="main-ship-image"
      >


      <button 
        id="start-game"
        class="primary-btn"
      >
        Start Game
      </button>

    </div>

  </section>



  <!-- =====================
       MODE SELECT
  ====================== -->

  <section 
    id="mode-screen" 
    class="hidden player-selection"
  >

    <div class="card">

      <h2>
        Choose Opponent
      </h2>


      <div class="players-container">


        <div class="card player-card">

          <h3>
            👥 Player vs Player
          </h3>

          <button 
            id="player-mode"
            class="primary-btn"
          >
            Select
          </button>

        </div>



        <div class="card player-card">

          <h3>
            🤖 Player vs Computer
          </h3>

          <button 
            id="computer-mode"
            class="primary-btn"
          >
            Select
          </button>

        </div>


      </div>

    </div>

  </section>





  <!-- =====================
       PLACE SHIPS
  ====================== -->


  <section 
    id="placement-screen"
    class="hidden placement-screen"
  >


    <div class="card">


      <h2>
        Place Your Ships 🚢
      </h2>


      <div class="ship-selector">

        <button class="ship-option">
          🚢 Carrier (5)
        </button>

        <button class="ship-option">
          🚢 Battleship (4)
        </button>

        <button class="ship-option">
          🚢 Cruiser (3)
        </button>

        <button class="ship-option">
          🚢 Submarine (3)
        </button>

        <button class="ship-option">
          🚢 Destroyer (2)
        </button>


      </div>



      <div id="placement-board"></div>


      <button 
        id="confirm-placement"
        class="confirm-placement hidden"
      >
        Confirm Fleet 🚢
      </button>


    </div>


  </section>





  <!-- =====================
       GAME SCREEN
  ====================== -->


  <main 
    id="game" 
    class="hidden game-screen"
  >


    <div class="card">

      <h2>
        Player 🟢
      </h2>

      <div id="player-board"></div>

    </div>




    <div class="card">

      <h2>
        Enemy 🔴
      </h2>

      <div id="enemy-board"></div>

    </div>


  </main>






  <!-- =====================
       WINNER MODAL
  ====================== -->


  <div 
    id="winner-modal" 
    class="hidden"
  >

    <div class="modal-content">

      <h2 id="winner-text"></h2>


      <button 
        id="restart-game"
        class="primary-btn"
      >
        Play Again
      </button>


    </div>

  </div>



</body>
