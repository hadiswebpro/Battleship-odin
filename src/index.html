<body>
<section id="start-screen" class="main-menu">
  <div class="card main-menu-card">
    <div class="hero-content">
      <h1 class="game-title">⚓ Battleship</h1>
      <p class="subtitle">Sink the enemy fleet</p>
      <button id="start-game" class="primary-btn">Start Game</button>
    </div>
    <img class="main-ship-image" alt="Battleship ship">
  </div>
</section>

<section id="mode-screen" class="hidden player-selection">
  <button id="mode-back" class="back-btn">← Back</button>
  <div class="card">
    <h2>Choose Opponent</h2>
    <div class="mode-buttons">
      <div class="card player-card"><h3>👥 Player vs Player</h3><button id="player-mode" class="primary-btn">Select</button></div>
      <div class="card player-card"><h3>🤖 Player vs Computer</h3><button id="computer-mode" class="primary-btn">Select</button></div>
    </div>
  </div>
</section>

<section id="placement-screen" class="hidden placement-screen">
  <button id="placement-back" class="back-btn">← Back</button>
  <div class="card">
    <h2>Place Your Ships 🚢</h2>
    <div class="ship-selector">
      <button class="ship-option" data-ship="Carrier" data-length="5">Carrier (5)</button>
      <button class="ship-option" data-ship="Battleship" data-length="4">Battleship (4)</button>
      <button class="ship-option" data-ship="Cruiser" data-length="3">Cruiser (3)</button>
      <button class="ship-option" data-ship="Submarine" data-length="3">Submarine (3)</button>
      <button class="ship-option" data-ship="Destroyer" data-length="2">Destroyer (2)</button>
    </div>
    <div id="player-board"></div>
    <div class="placement-actions">
      <button class="rotate-ship">Rotate</button>
      <button id="confirm-placement" class="confirm-placement">Start Game</button>
    </div>
  </div>
</section>

<section id="game" class="hidden game-screen">
  <div class="card game-card">
    <h2>⚓ Battleship</h2>
    <p id="turn-status">Player Turn</p>
    <div class="battle-boards">
      <div class="board-panel">
        <h3>Your Fleet</h3>
        <div id="your-board"></div>
      </div>
      <div class="board-panel">
        <h3>Enemy Fleet</h3>
        <div id="enemy-board"></div>
      </div>
    </div>
    <button id="quit-game" class="primary-btn">Quit Game</button>
  </div>
</section>

<div id="ready-modal" class="hidden">
  <div class="card">
    <h2>Ready for Battle?</h2>
    <p>Your fleet is ready. Start the battle?</p>
    <button id="start-battle" class="primary-btn">Start Battle</button>
  </div>
</div>

<div id="quit-modal" class="hidden">
  <div class="card">
    <h2>Quit Game?</h2>
    <p>Are you sure you want to leave the battle?</p>
    <button id="continue-game" class="primary-btn">Continue</button>
    <button id="main-menu" class="primary-btn">Main Menu</button>
  </div>
</div>

<div id="winner-modal" class="hidden">
  <div class="card">
    <h2 id="winner-text">Player wins!</h2>
    <button id="play-again" class="primary-btn">Play Again</button>
    <button id="winner-main-menu" class="primary-btn">Main Menu</button>
  </div>
</div>
</body>
